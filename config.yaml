# Ming: every rule in one place. The dashboard can change the keys listed under editable; changes land in DATA_DIR/overrides.json.
mode: paper                # paper | live  (live also needs LIVE_CONFIRM=YES in the environment)
timezone: America/New_York
hold_mode: day             # day | swing | both. day: flat by the close, intraday hunts. swing: hold until stop, target, or invalidation. both: two books side by side, Sol tags each thesis day or swing. The chat can flip it.

schedule:                  # weekdays, Eastern. review runs in swing mode only; flatten and the intraday jobs run in day mode only.
  research: "06:00"
  refresh:  "09:00"
  sweep:    "09:31"        # day mode: sell any day-book position left over from an earlier day
  execute:  "09:35"
  review:   "15:45"
  flatten:  "15:55"
  report:   "16:05"
  reflect:  "16:10"        # lessons from the day's closed trades, written to lessons.md on the volume and read every morning

books:                     # in both mode the capital cap is split between the two books; a name can sit in only one book at a time
  day_share_pct: 50        # share of capital_cap the day book gets; the swing book gets the rest

day:                       # the day book
  instrument: options      # options | stock. options: long calls and long puts only (Caden's override of the no-options rule, 09-23). stock: shares.
  scan_every_min: 2        # intraday position check: stop-outs, targets, trailing stops. No LLM. Options stops live in the engine, so this is the stop.
  hunt_every_min: 30       # intraday research: fresh news and movers -> new theses -> rules engine -> entries
  first_hunt: "10:00"      # first intraday hunt, ET (9:35 execute already took the morning theses)
  last_entry: "15:00"      # no new entries after this, ET
  no_entry_windows: [["11:30", "13:30"]]   # the midday lull: no entries, and hunts skip
  thesis_max_age_min: 90   # a day thesis older than this is stale and is skipped, never bought late
  max_trades_per_day: 3    # entries per day in the day book; the edge is in the best two or three, not the spray
  confirm:                 # tape confirmation at entry; every rule must pass or the thesis is skipped with the reason
    enabled: false         # OFF until the end-of-week rework: it depends on live bar data that has not been exercised yet
    min_rel_vol: 1.2       # today's volume pace against the 20 day average
    vwap: true             # calls need the stock above VWAP, puts below
    max_extension_atr: 1.5 # skip if the stock has already moved more than this many average daily ranges today in the thesis direction
  no_macro_etfs: [SPY, QQQ, IWM, DIA, USO, GLD, SLV, TLT, XLE, XLF, XLK, XLV, ARKK, SQQQ, TQQQ, UVXY, VXX]   # not catalysts; skipped unless the operator directs one
  stop_loss_pct: 1.5       # fallback exits when the stock has no volatility data
  take_profit_pct: 3
  trail_trigger_pct: 1.5
  trail_pct: 1
  stop_atr_mult: 0.5       # volatility exits: stop = this x the stock's average daily range (ATR as a percent of price), clamped below
  target_atr_mult: 2.0     # 09-22: raised from 1.0 so the trailing stop, not the target, ends a winner; losers are unchanged
  stop_min_pct: 0.8
  stop_max_pct: 3
  target_min_pct: 2.5
  target_max_pct: 10

options:                   # the day book when instrument is options. Everything here is in percent of the premium paid.
  dte_min: 3               # days to expiry window; closest to dte_target wins
  dte_max: 14
  dte_target: 7
  delta_target: 0.45       # strike closest to this delta (near the money); nearest to the underlying price when greeks are missing
  min_open_interest: 100
  max_spread_pct: 10       # (ask - bid) / mid; wider than this is skipped
  min_premium: 0.30        # per share; cheaper contracts are lottery tickets
  max_position_pct: 4      # of the cap in premium per trade. With the 35% stop that risks about 1.4% of the cap per trade, so three losers fit inside the daily cap. 09-23: was 10, and one stop equalled the whole daily cap.
  stop_pct: 35             # engine stop on the premium
  underlying_stop: false   # OFF until the rework: when on, the working stop moves to the stock (stop_atr_mult) and stop_pct becomes the catastrophe backstop
  stop_atr_mult: 0.5
  target_pct: 80
  trail_trigger_pct: 30
  trail_pct: 20

swing:                     # the swing book. Stop and target fall back to the aggression preset when there is no volatility data.
  stop_atr_mult: 1.5
  target_atr_mult: 4
  stop_min_pct: 2.5
  stop_max_pct: 8
  target_min_pct: 6
  target_max_pct: 20

risk:
  capital_cap: 20000       # dollars Ming is allowed to deploy, regardless of account size
  loss_cap_daily_pct: 3    # down this much on the day -> flatten and halt
  loss_cap_total_pct: 10   # down this much from the baseline -> flatten and halt
  max_positions: 5
  max_position_pct: 15     # of capital_cap, per name
  max_sector_positions: 2
  stop_loss_pct: 4
  trail_trigger_pct: 5     # once up this much, the stop starts trailing
  trail_pct: 4
  take_profit_pct: 12
  min_conviction: 7
  min_price: 5

editable: [capital_cap, loss_cap_daily_pct, loss_cap_total_pct, max_positions, max_position_pct, max_sector_positions, stop_loss_pct, trail_trigger_pct, trail_pct, take_profit_pct, min_conviction, min_price]

aggression:                # ten presets; the dial sets one and it overrides the matching risk keys
  1:  {name: Sleeping giant, max_positions: 2, max_position_pct: 8,  stop_loss_pct: 3, min_conviction: 9, loss_cap_daily_pct: 1.5, loss_cap_total_pct: 5}
  2:  {name: Cautious,       max_positions: 3, max_position_pct: 10, stop_loss_pct: 3, min_conviction: 8, loss_cap_daily_pct: 2,   loss_cap_total_pct: 6}
  3:  {name: Careful,        max_positions: 3, max_position_pct: 12, stop_loss_pct: 3.5, min_conviction: 8, loss_cap_daily_pct: 2, loss_cap_total_pct: 7}
  4:  {name: Measured,       max_positions: 4, max_position_pct: 13, stop_loss_pct: 4, min_conviction: 7, loss_cap_daily_pct: 2.5, loss_cap_total_pct: 8}
  5:  {name: Balanced,       max_positions: 5, max_position_pct: 15, stop_loss_pct: 4, min_conviction: 7, loss_cap_daily_pct: 3,   loss_cap_total_pct: 10}
  6:  {name: Leaning in,     max_positions: 5, max_position_pct: 18, stop_loss_pct: 5, min_conviction: 7, loss_cap_daily_pct: 3.5, loss_cap_total_pct: 12}
  7:  {name: Forward,        max_positions: 6, max_position_pct: 20, stop_loss_pct: 5, min_conviction: 6, loss_cap_daily_pct: 4,   loss_cap_total_pct: 14}
  8:  {name: Hot,            max_positions: 6, max_position_pct: 22, stop_loss_pct: 6, min_conviction: 6, loss_cap_daily_pct: 5,   loss_cap_total_pct: 16}
  9:  {name: Full tilt,      max_positions: 7, max_position_pct: 25, stop_loss_pct: 7, min_conviction: 5, loss_cap_daily_pct: 6,   loss_cap_total_pct: 18}
  10: {name: Full send,      max_positions: 8, max_position_pct: 30, stop_loss_pct: 8, min_conviction: 5, loss_cap_daily_pct: 8,   loss_cap_total_pct: 20}

llm:
  model: gpt-5.6-sol        # Sol; override with OPENAI_MODEL
  voice_model: gpt-realtime-2.1-mini
  voice: cedar              # OpenAI voice name; override with OPENAI_VOICE
  max_theses: 8

sources:                    # research reads these every run, in this order. Tier 1 is primary, tier 3 is confirmation only.
  tier1:
    - {name: SEC 8-K filings,        url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&count=100&output=atom"}
    - {name: Business Wire,          url: "https://feed.businesswire.com/rss/home/?rss=G1QFDERJXkJeEFpRVQ=="}
    - {name: PR Newswire,            url: "https://www.prnewswire.com/rss/news-releases-list.rss"}
    - {name: GlobeNewswire,          url: "https://www.globenewswire.com/RssFeed/subjectcode/10-Earnings%20Releases%20and%20Operating%20Results/feedTitle/GlobeNewswire%20-%20Earnings"}
  tier2:
    - {name: CNBC markets,           url: "https://www.cnbc.com/id/20910258/device/rss/rss.html"}
    - {name: CNBC top news,          url: "https://www.cnbc.com/id/100003114/device/rss/rss.html"}
    - {name: MarketWatch top,        url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"}
    - {name: MarketWatch pulse,      url: "https://feeds.content.dowjones.io/public/rss/mw_realtimeheadlines"}
    - {name: Benzinga,               url: "https://www.benzinga.com/feed"}
    - {name: Investing.com news,     url: "https://www.investing.com/rss/news_25.rss"}
  firecrawl_queries:
    - "premarket movers today"
    - "stocks moving premarket today earnings guidance"
    - "FDA approval today stock"
    - "analyst upgrade today stock"
  excluded_domains: [reddit.com, x.com, twitter.com, fool.com, seekingalpha.com, stocktwits.com]
